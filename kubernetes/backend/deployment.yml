kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-deployment
  namespace: development
  labels: 
    app: my-app
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: my-app
  template:
    metadata: 
      labels:
        app: my-app
    spec:
      containers: 
      - name: backend
        image: my-backend-image
        ports: 
        - containerPort: 5000
