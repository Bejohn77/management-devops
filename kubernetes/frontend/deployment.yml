kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: development
  labels: 
    app: my-app
spec:
  replicas: 3
  selector: 
    matchLabels: 
      app: my-app
  template:
    metadata: 
      labels:
        app: my-app
    spec:
      containers: 
      - name: nginx
        image: nginx:latest
        ports: 
        - containerPort: 80
